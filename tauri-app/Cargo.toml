[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/micyou-protocol",
  "crates/micyou-audio",
  "crates/micyou-plugin",
  "crates/micyou-plugin/fixtures/native",
  "crates/micyou-cli",
  "crates/micyou-tui",
  "crates/opus-decoder",
]

# Vendored fork of opus-decoder 0.1.1: guards the CELT collapse-mask computation
# against corrupted frames that otherwise trigger a u8 shift-left overflow panic.
# Patch source: crates/opus-decoder/src/celt/vq.rs
[patch.crates-io]
opus-decoder = { path = "crates/opus-decoder" }

[workspace.package]
version = "2.0.0"
authors = ["LanRhyme"]
edition = "2021"
license = "GPL-3.0-only"

[workspace.metadata.tools]
cargo-about = "0.9.1"
