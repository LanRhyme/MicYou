[workspace]
resolver = "2"
members = [
  "src-tauri",
  "crates/micyou-protocol",
  "crates/micyou-audio",
  "crates/micyou-plugin",
  "crates/micyou-plugin/fixtures/native",
  "crates/micyou-cli",
  "crates/micyou-tui",
]

[patch.crates-io]
opus-decoder = { git = "https://github.com/tfr0305/Rusopus.git", branch = "master" }

[workspace.package]
version = "2.0.2"
authors = ["LanRhyme"]
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.metadata.tools]
cargo-about = "0.9.1"
