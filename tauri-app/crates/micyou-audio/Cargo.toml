[package]
name = "micyou-audio"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["dsp"]
dsp = ["dep:nnnoiseless", "dep:rustfft"]
noise-suppression = ["dsp", "dep:micyou-infer"]

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4.32"
cpal.workspace = true
rubato = "5.0.1"
ringbuf = "0.5.2"

# DSP dependencies (optional)
nnnoiseless = { version = "0.5.2", optional = true }
micyou-infer = { workspace = true, optional = true }
rustfft = { version = "6.4.1", optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
