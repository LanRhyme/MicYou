[package]
name = "micyou-cli"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "MicYou command-line interface"

[[bin]]
name = "micyou"
path = "src/main.rs"

[dependencies]
micyou-app = { path = "../../src-tauri" }
micyou-audio = { path = "../micyou-audio", features = [
  "dsp",
  "noise-suppression",
] }

clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
zip = "2.2"
micyou-plugin = { path = "../micyou-plugin" }
wat = "1"
semver = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2.169"
