<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <title>变声器控制</title>
    <style>
      /* 宿主注入当前主题 HSL CSS 变量，自动跟随软件主题 */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: hsl(var(--surface));
        color: hsl(var(--on-surface));
        padding: 20px;
        font-size: 14px;
      }
      .card {
        background: hsl(var(--surface-bright));
        border: 1px solid hsl(var(--border));
        border-radius: 1rem;
        padding: 16px;
      }
      .card + .card {
        margin-top: 14px;
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      .head h2 {
        font-size: 18px;
        font-weight: 700;
        color: hsl(var(--primary));
      }
      .badge {
        font-size: 11px;
        padding: 4px 10px;
        border-radius: 9999px;
        background: hsl(var(--primary-container));
        color: hsl(var(--on-primary-container));
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }
      .lbl {
        font-size: 13px;
        color: hsl(var(--on-surface-variant));
        font-weight: 600;
      }
      .val {
        font-size: 15px;
        font-weight: 700;
        color: hsl(var(--on-surface));
        min-width: 48px;
        text-align: right;
      }
      input[type="range"] {
        width: 100%;
        margin-top: 10px;
        accent-color: hsl(var(--primary));
        height: 6px;
        border-radius: 9999px;
        background: linear-gradient(
          to right,
          hsl(var(--primary)) 0%,
          hsl(var(--primary)) var(--fill, 50%),
          hsl(var(--surface-variant)) var(--fill, 50%)
        );
        -webkit-appearance: none;
        appearance: none;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: hsl(var(--primary));
        border: 3px solid hsl(var(--surface-bright));
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-top: 14px;
      }
      .preset {
        border: 1px solid hsl(var(--border));
        border-radius: 9999px;
        padding: 8px 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: hsl(var(--surface-container));
        color: hsl(var(--on-surface-variant));
        transition: filter 0.15s ease;
      }
      .preset:hover {
        filter: brightness(0.95);
      }
      .preset.active {
        background: hsl(var(--primary));
        color: hsl(var(--on-primary));
        border-color: transparent;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
      }
      .toggle {
        position: relative;
        width: 44px;
        height: 24px;
        border-radius: 9999px;
        background: hsl(var(--surface-variant));
        border: none;
        cursor: pointer;
        transition: background 0.2s;
      }
      .toggle.on {
        background: hsl(var(--primary));
      }
      .toggle .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: hsl(var(--surface-bright));
        transition: transform 0.2s;
      }
      .toggle.on .knob {
        transform: translateX(20px);
      }
      .hint {
        font-size: 12px;
        color: hsl(var(--on-surface-variant));
        margin-top: 12px;
        line-height: 1.6;
      }
      .err {
        color: hsl(var(--error));
        font-size: 12px;
        margin-top: 10px;
      }
      .spacer {
        flex: 1;
      }
      .ghostbtn {
        border: 1px solid hsl(var(--border));
        border-radius: 9999px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        background: hsl(var(--surface-container));
        color: hsl(var(--on-surface-variant));
        transition: filter 0.15s ease;
      }
      .ghostbtn:hover {
        filter: brightness(0.95);
      }
    </style>
  </head>
  <body>
    <div class="head">
      <h2>变声器控制</h2>
      <span class="badge">WASM 示例</span>
    </div>

    <div class="card">
      <div class="row">
        <span class="lbl">音高（Pitch）</span>
        <span class="val" id="pitchval">1.3</span>
      </div>
      <input
        type="range"
        id="pitch"
        min="0.5"
        max="2.0"
        step="0.05"
        value="1.3"
      />
      <div class="presets" id="presets"></div>
      <div class="toggle-row">
        <button class="toggle" id="bypass" title="启用/停用变声">
          <span class="knob"></span>
        </button>
        <span class="lbl" id="bypasslbl">变声生效中</span>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <span class="lbl">处理链位置</span>
        <span class="spacer"></span>
        <button class="ghostbtn" id="chainbtn">设置里调整</button>
      </div>
      <div class="hint">
        本节点默认在 AEC 之后，可在「设置 → 音频 → 处理链」中拖拽移动
      </div>
    </div>

    <div id="err" class="err"></div>

    <script>
      let bypassLblActive = true;
const T = {
  'zh-CN': {
    title: '变声控制', sub: '实时 DSP 变声（WASM 沙箱）', bypassOn: '变声生效中', bypassOff: '已停用（原声直通）',
    pitch: '音调', presets: '预设', preset0: '原声', preset1: '萌妹', preset2: '大叔', preset3: '花栗鼠',
    chain: '处理链位置', chainAfter: '在 AEC 之后', saved: '已保存',
  },
  en: {
    title: 'Voice Changer', sub: 'Real-time DSP voice changer (WASM sandbox)', bypassOn: 'Voice change active', bypassOff: 'Disabled (passthrough)',
    pitch: 'Pitch', presets: 'Presets', preset0: 'Original', preset1: 'Cute', preset2: 'Deep', preset3: 'Chipmunk',
    chain: 'Chain position', chainAfter: 'After AEC', saved: 'Saved',
  },
};
let t = T.en;
call('locale').catch(() => 'en').then((lang) => {
  t = String(lang).startsWith('zh') ? T['zh-CN'] : T.en;
  document.title = t.title;
  const el = (id) => document.getElementById(id);
  if (el('title')) el('title').textContent = t.title;
  if (el('sub')) el('sub').textContent = t.sub;
  if (el('bypasslbl')) el('bypasslbl').textContent = bypassLblActive ? t.bypassOn : t.bypassOff;
  if (el('pitchlbl')) el('pitchlbl').textContent = t.pitch;
  if (el('presetslbl')) el('presetslbl').textContent = t.presets;
  if (el('chainlbl')) el('chainlbl').textContent = t.chain;
  if (el('chainafter')) el('chainafter').textContent = t.chainAfter;
  const presets = document.querySelectorAll('.presets .preset');
  if (presets.length >= 4) {
    presets[0].textContent = t.preset0; presets[1].textContent = t.preset1;
    presets[2].textContent = t.preset2; presets[3].textContent = t.preset3;
  }
});

function call(api, args) {
        return new Promise((resolve, reject) => {
          const id = Math.random().toString(36).slice(2);
          const onMsg = (e) => {
            if (e.data && e.data.__micyou === 1 && e.data.id === id) {
              window.removeEventListener("message", onMsg);
              e.data.ok
                ? resolve(e.data.value)
                : reject(new Error(e.data.error));
            }
          };
          window.addEventListener("message", onMsg);
          window.parent.postMessage(
            { __micyou: 1, id, api, args: args || {} },
            "*",
          );
        });
      }

      const errEl = document.getElementById("err");
      const pitchEl = document.getElementById("pitch");
      const pitchVal = document.getElementById("pitchval");
      const bypassBtn = document.getElementById("bypass");
      const bypassLbl = document.getElementById("bypasslbl");
      const presetsEl = document.getElementById("presets");

      const PRESETS = [
        { label: "原声", pitch: 1.0 },
        { label: "萌妹", pitch: 1.45 },
        { label: "大叔", pitch: 0.7 },
        { label: "花栗鼠", pitch: 1.9 },
      ];

      function paintFill() {
        const min = parseFloat(pitchEl.min),
          max = parseFloat(pitchEl.max);
        const v = parseFloat(pitchEl.value);
        pitchEl.style.setProperty(
          "--fill",
          ((v - min) / (max - min)) * 100 + "%",
        );
      }

      // 仅匹配预设容器内的按钮（处理链按钮使用独立样式类，避免误匹配）
      function setPresetActive(pitch) {
        document.querySelectorAll(".presets .preset").forEach((b, i) => {
          const preset = PRESETS[i];
          b.classList.toggle(
            "active",
            preset != null && Math.abs(preset.pitch - pitch) < 0.01,
          );
        });
      }

      async function save(key, value) {
        try {
          await call("set_config", { key, value });
        } catch (e) {
          errEl.textContent = String(e);
        }
      }

      pitchEl.addEventListener("input", () => {
        const v = parseFloat(pitchEl.value);
        pitchVal.textContent = v.toFixed(2);
        paintFill();
        setPresetActive(v);
        save("pitch", v);
      });

      // 开关 ON = 变声生效（宿主 bypass=false）；OFF = 原声直通（bypass=true）
      bypassBtn.addEventListener("click", () => {
        const on = !bypassBtn.classList.contains("on");
        bypassBtn.classList.toggle("on", on);
        bypassLbl.textContent = on ? (t.bypassOn) : (t.bypassOff); bypassLblActive = on;
        save("bypass", !on);
      });

      // 处理链按钮：提示在设置中调整（实际调整入口在「设置 → 音频 → 处理链」）
      document.getElementById("chainbtn").addEventListener("click", () => {
        errEl.textContent =
          "请在「设置 → 音频 → 处理链」中拖拽「插件」节点调整本节点位置";
      });

      for (const p of PRESETS) {
        const b = document.createElement("button");
        b.className = "preset";
        b.textContent = p.label;
        b.onclick = () => {
          pitchEl.value = String(p.pitch);
          pitchVal.textContent = p.pitch.toFixed(2);
          paintFill();
          setPresetActive(p.pitch);
          save("pitch", p.pitch);
        };
        presetsEl.appendChild(b);
      }

      async function init() {
        try {
          const cfg = await call("get_config", {});
          const cfgObj = cfg && typeof cfg === "object" ? cfg : {};
          const pitch = typeof cfgObj.pitch === "number" ? cfgObj.pitch : 1.3;
          pitchEl.value = String(pitch);
          pitchVal.textContent = pitch.toFixed(2);
          paintFill();
          setPresetActive(pitch);
          // 开关 ON 表示变声生效（宿主 bypass=false），OFF 表示原声直通
          const bypass = cfgObj.bypass;
          const active = bypass === false; // undefined（未配置）视为变声生效
          bypassBtn.classList.toggle("on", active);
          bypassLbl.textContent = active ? (t.bypassOn) : (t.bypassOff); bypassLblActive = active;
        } catch (e) {
          errEl.textContent = String(e);
        }
      }
      init();
    </script>
  </body>
</html>
