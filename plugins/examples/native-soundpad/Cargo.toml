[package]
name = "micyou-example-native-soundpad"
version = "1.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "MicYou native plugin example: a soundpad with UI buttons and host audio playback"
publish = false

# Standalone crate: build on demand with `cargo build --release`
# (not part of the workspace so it mirrors an external plugin author)
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
